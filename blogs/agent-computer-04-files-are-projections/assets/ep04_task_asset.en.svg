<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><style>
.bg{fill:#F7F9FC}.title{font:700 28px sans-serif;fill:#1F2937}.sub{font:400 16px sans-serif;fill:#64748B}.node{stroke:#CBD5E1;stroke-width:2;rx:14;fill:#FFFFFF}.blue{fill:#EFF6FF;stroke:#93C5FD}.teal{fill:#ECFDF5;stroke:#6EE7B7}.amber{fill:#FFFBEB;stroke:#FCD34D}.red{fill:#FEF2F2;stroke:#FCA5A5}.purple{fill:#F5F3FF;stroke:#C4B5FD}.node-title{font:700 18px sans-serif;fill:#1F2937}.node-text{font:400 14px sans-serif;fill:#64748B}.label{font:700 14px sans-serif;fill:#1F2937}.small{font:400 12px sans-serif;fill:#64748B}.edge{stroke:#2563EB;stroke-width:3;fill:none}.edge-muted{stroke:#CBD5E1;stroke-width:3;fill:none}.dashed{stroke-dasharray:8 7}.pill{font:700 13px sans-serif;fill:#FFFFFF}
</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563EB"/></marker><marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#CBD5E1"/></marker></defs><rect class="bg" width="1200" height="720"/><text class="title" x="48" y="52">EP04 | A task asset is not an isolated file</text><text class="sub" x="48" y="82">The file is the visible result; the task structure decides why it holds, whether it can be reused and how to re-verify it.</text><rect class="node amber" x="60" y="155" width="210" height="120"/><rect x="60" y="155" width="8" height="120" rx="4" fill="#B45309"/><text class="node-title" x="84" y="189" text-anchor="start">Final file</text><text class="node-text" x="84" y="217" text-anchor="start">Reports, code, charts</text><text class="node-text" x="84" y="239" text-anchor="start">The visible result</text><rect class="node purple" x="330" y="155" width="210" height="120"/><rect x="330" y="155" width="8" height="120" rx="4" fill="#7C3AED"/><text class="node-title" x="354" y="189" text-anchor="start">Spec Package</text><text class="node-text" x="354" y="217" text-anchor="start">Goal, evidence, constraints</text><text class="node-text" x="354" y="239" text-anchor="start">Environment, capabilities</text><rect class="node blue" x="600" y="155" width="210" height="120"/><rect x="600" y="155" width="8" height="120" rx="4" fill="#2563EB"/><text class="node-title" x="624" y="189" text-anchor="start">Run Package</text><text class="node-text" x="624" y="217" text-anchor="start">Candidates, projection</text><text class="node-text" x="624" y="239" text-anchor="start">Permission, commit, receipt</text><rect class="node teal" x="870" y="155" width="260" height="120"/><rect x="870" y="155" width="8" height="120" rx="4" fill="#0F766E"/><text class="node-title" x="894" y="189" text-anchor="start">Task asset</text><text class="node-text" x="894" y="217" text-anchor="start">Applicable conditions</text><text class="node-text" x="894" y="239" text-anchor="start">Failure boundaries</text><text class="node-text" x="894" y="261" text-anchor="start">Reuse and migration</text><path class="edge" marker-end="url(#arrow)" d="M270,215 L326,215"/><path class="edge" marker-end="url(#arrow)" d="M540,215 L596,215"/><path class="edge" marker-end="url(#arrow)" d="M810,215 L866,215"/><rect class="node blue" x="100" y="420" width="290" height="115"/><rect x="100" y="420" width="8" height="115" rx="4" fill="#2563EB"/><text class="node-title" x="124" y="454" text-anchor="start">Semantic replay</text><text class="node-text" x="124" y="482" text-anchor="start">Same goal, understood again</text><text class="node-text" x="124" y="504" text-anchor="start">Results may differ</text><rect class="node teal" x="455" y="420" width="290" height="115"/><rect x="455" y="420" width="8" height="115" rx="4" fill="#0F766E"/><text class="node-title" x="479" y="454" text-anchor="start">Behavioral approx.</text><text class="node-text" x="479" y="482" text-anchor="start">Process roughly the same</text><text class="node-text" x="479" y="504" text-anchor="start">Differences allowed</text><rect class="node purple" x="810" y="420" width="290" height="115"/><rect x="810" y="420" width="8" height="115" rx="4" fill="#7C3AED"/><text class="node-title" x="834" y="454" text-anchor="start">Deterministic reproduction</text><text class="node-text" x="834" y="482" text-anchor="start">Conditions, deps, versions locked</text><text class="node-text" x="834" y="504" text-anchor="start">Result is repeatable</text><path class="edge" marker-end="url(#arrow)" d="M390,477 L451,477"/><path class="edge" marker-end="url(#arrow)" d="M745,477 L806,477"/><rect x="90" y="620" width="330" height="30" rx="15" fill="#B45309"/><text class="pill" x="255.0" y="640" text-anchor="middle">Not fake, just missing its structure</text><rect x="470" y="620" width="300" height="30" rx="15" fill="#B91C1C"/><text class="pill" x="620.0" y="640" text-anchor="middle">Internal state is not a receipt</text><rect x="830" y="620" width="280" height="30" rx="15" fill="#0F766E"/><text class="pill" x="970.0" y="640" text-anchor="middle">Projection ≠ the thing itself</text></svg>