<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><style>
.bg{fill:#F7F9FC}.title{font:700 28px sans-serif;fill:#1F2937}.sub{font:400 16px sans-serif;fill:#64748B}.node{stroke:#CBD5E1;stroke-width:2;rx:14;fill:#FFFFFF}.blue{fill:#EFF6FF;stroke:#93C5FD}.teal{fill:#ECFDF5;stroke:#6EE7B7}.amber{fill:#FFFBEB;stroke:#FCD34D}.red{fill:#FEF2F2;stroke:#FCA5A5}.purple{fill:#F5F3FF;stroke:#C4B5FD}.node-title{font:700 18px sans-serif;fill:#1F2937}.node-text{font:400 14px sans-serif;fill:#64748B}.label{font:700 14px sans-serif;fill:#1F2937}.small{font:400 12px sans-serif;fill:#64748B}.edge{stroke:#2563EB;stroke-width:3;fill:none}.edge-muted{stroke:#CBD5E1;stroke-width:3;fill:none}.dashed{stroke-dasharray:8 7}.pill{font:700 13px sans-serif;fill:#FFFFFF}
</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563EB"/></marker><marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#CBD5E1"/></marker></defs><rect class="bg" width="1200" height="720"/><text class="title" x="48" y="52">EP02 | Results are projections; structure explains them</text><text class="sub" x="48" y="82">The same result can come from different processes; the same task structure yields different results as conditions change.</text><rect class="node purple" x="65" y="160" width="230" height="130"/><rect x="65" y="160" width="8" height="130" rx="4" fill="#7C3AED"/><text class="node-title" x="89" y="194" text-anchor="start">Generative structure</text><text class="node-text" x="89" y="222" text-anchor="start">Goal and object</text><text class="node-text" x="89" y="244" text-anchor="start">Evidence and constraints</text><text class="node-text" x="89" y="266" text-anchor="start">Env., capabilities, perms</text><text class="node-text" x="89" y="288" text-anchor="start">Acceptance, choice, receipt</text><rect class="node blue" x="485" y="160" width="230" height="130"/><rect x="485" y="160" width="8" height="130" rx="4" fill="#2563EB"/><text class="node-title" x="509" y="194" text-anchor="start">Conditions and run</text><text class="node-text" x="509" y="222" text-anchor="start">Time, budget, device</text><text class="node-text" x="509" y="244" text-anchor="start">Model and tool versions</text><text class="node-text" x="509" y="266" text-anchor="start">User choice, authorization</text><text class="node-text" x="509" y="288" text-anchor="start">State of the real world</text><rect class="node amber" x="905" y="160" width="230" height="130"/><rect x="905" y="160" width="8" height="130" rx="4" fill="#B45309"/><text class="node-title" x="929" y="194" text-anchor="start">Result projection</text><text class="node-text" x="929" y="222" text-anchor="start">Files, reports, code</text><text class="node-text" x="929" y="244" text-anchor="start">Charts, device state</text><text class="node-text" x="929" y="266" text-anchor="start">One concrete output</text><path class="edge" marker-end="url(#arrow)" d="M295,225 L481,225"/><path class="edge" marker-end="url(#arrow)" d="M715,225 L901,225"/><text class="label" x="330" y="205" text-anchor="start">+ new conditions</text><text class="label" x="750" y="205" text-anchor="start">yields one result</text><rect class="node amber" x="65" y="430" width="230" height="110"/><rect x="65" y="430" width="8" height="110" rx="4" fill="#B45309"/><text class="node-title" x="89" y="464" text-anchor="start">Save the result</text><text class="node-text" x="89" y="492" text-anchor="start">Opens fine</text><text class="node-text" x="89" y="514" text-anchor="start">Reads fine</text><text class="node-text" x="89" y="536" text-anchor="start">But conditions are lost</text><rect class="node teal" x="485" y="430" width="230" height="110"/><rect x="485" y="430" width="8" height="110" rx="4" fill="#0F766E"/><text class="node-title" x="509" y="464" text-anchor="start">Save the structure</text><text class="node-text" x="509" y="492" text-anchor="start">Why it came out this way</text><text class="node-text" x="509" y="514" text-anchor="start">Which conditions still hold</text><text class="node-text" x="509" y="536" text-anchor="start">How to re-judge next time</text><rect class="node teal" x="905" y="430" width="230" height="110"/><rect x="905" y="430" width="8" height="110" rx="4" fill="#0F766E"/><text class="node-title" x="929" y="464" text-anchor="start">Safe reuse</text><text class="node-text" x="929" y="492" text-anchor="start">Migrate or re-verify</text><text class="node-text" x="929" y="514" text-anchor="start">Tell fact from inference</text><text class="node-text" x="929" y="536" text-anchor="start">Keep real-world receipts</text><path class="edge" marker-end="url(#arrow)" d="M295,485 L481,485"/><path class="edge" marker-end="url(#arrow)" d="M715,485 L901,485"/><rect x="120" y="620" width="300" height="30" rx="15" fill="#B45309"/><text class="pill" x="270.0" y="640" text-anchor="middle">Same result ≠ same task</text><rect x="590" y="620" width="420" height="30" rx="15" fill="#2563EB"/><text class="pill" x="800.0" y="640" text-anchor="middle">Different result ≠ failed task</text></svg>