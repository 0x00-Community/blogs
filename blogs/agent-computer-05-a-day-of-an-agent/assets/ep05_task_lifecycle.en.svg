<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><style>
.bg{fill:#F7F9FC}.title{font:700 28px sans-serif;fill:#1F2937}.sub{font:400 16px sans-serif;fill:#64748B}.node{stroke:#CBD5E1;stroke-width:2;rx:14;fill:#FFFFFF}.blue{fill:#EFF6FF;stroke:#93C5FD}.teal{fill:#ECFDF5;stroke:#6EE7B7}.amber{fill:#FFFBEB;stroke:#FCD34D}.red{fill:#FEF2F2;stroke:#FCA5A5}.purple{fill:#F5F3FF;stroke:#C4B5FD}.node-title{font:700 18px sans-serif;fill:#1F2937}.node-text{font:400 14px sans-serif;fill:#64748B}.label{font:700 14px sans-serif;fill:#1F2937}.small{font:400 12px sans-serif;fill:#64748B}.edge{stroke:#2563EB;stroke-width:3;fill:none}.edge-muted{stroke:#CBD5E1;stroke-width:3;fill:none}.dashed{stroke-dasharray:8 7}.pill{font:700 13px sans-serif;fill:#FFFFFF}
</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563EB"/></marker><marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#CBD5E1"/></marker></defs><rect class="bg" width="1200" height="720"/><text class="title" x="48" y="52">EP05 | Nine stages an agent takes to finish a task</text><text class="sub" x="48" y="82">Not a prompt turned straight into action, but a verifiable chain from intent to real-world receipt.</text><rect class="node purple" x="55" y="145" width="300" height="105"/><rect x="55" y="145" width="8" height="105" rx="4" fill="#7C3AED"/><text class="node-title" x="79" y="179" text-anchor="start">Intent clarification</text><text class="node-text" x="79" y="207" text-anchor="start">What exactly should change?</text><text class="node-text" x="79" y="229" text-anchor="start">Clarify object and acceptance</text><path class="edge" marker-end="url(#arrow)" d="M355,197 L430,197"/><rect class="node blue" x="440" y="145" width="300" height="105"/><rect x="440" y="145" width="8" height="105" rx="4" fill="#2563EB"/><text class="node-title" x="464" y="179" text-anchor="start">Task structure</text><text class="node-text" x="464" y="207" text-anchor="start">Version the goal</text><text class="node-text" x="464" y="229" text-anchor="start">Record constraints and evidence</text><path class="edge" marker-end="url(#arrow)" d="M740,197 L815,197"/><rect class="node teal" x="825" y="145" width="300" height="105"/><rect x="825" y="145" width="8" height="105" rx="4" fill="#0F766E"/><text class="node-title" x="849" y="179" text-anchor="start">Capability compilation</text><text class="node-text" x="849" y="207" text-anchor="start">Which capabilities are needed?</text><text class="node-text" x="849" y="229" text-anchor="start">Request permissions per task</text><path class="edge-muted dashed" marker-end="url(#arrow-muted)" d="M975,250 L975,275 L205,275 L205,290"/><rect class="node purple" x="55" y="300" width="300" height="105"/><rect x="55" y="300" width="8" height="105" rx="4" fill="#7C3AED"/><text class="node-title" x="79" y="334" text-anchor="start">Planning and branching</text><text class="node-text" x="79" y="362" text-anchor="start">Which variables change?</text><text class="node-text" x="79" y="384" text-anchor="start">When to stop exploring</text><path class="edge" marker-end="url(#arrow)" d="M355,352 L430,352"/><rect class="node blue" x="440" y="300" width="300" height="105"/><rect x="440" y="300" width="8" height="105" rx="4" fill="#2563EB"/><text class="node-title" x="464" y="334" text-anchor="start">Controlled execution</text><text class="node-text" x="464" y="362" text-anchor="start">Where are errors contained?</text><text class="node-text" x="464" y="384" text-anchor="start">No direct contact with reality</text><path class="edge" marker-end="url(#arrow)" d="M740,352 L815,352"/><rect class="node teal" x="825" y="300" width="300" height="105"/><rect x="825" y="300" width="8" height="105" rx="4" fill="#0F766E"/><text class="node-title" x="849" y="334" text-anchor="start">Verification</text><text class="node-text" x="849" y="362" text-anchor="start">Is the candidate valid?</text><text class="node-text" x="849" y="384" text-anchor="start">Do the checks pass?</text><path class="edge-muted dashed" marker-end="url(#arrow-muted)" d="M975,405 L975,430 L205,430 L205,445"/><rect class="node purple" x="55" y="455" width="300" height="105"/><rect x="55" y="455" width="8" height="105" rx="4" fill="#7C3AED"/><text class="node-title" x="79" y="489" text-anchor="start">Selection</text><text class="node-text" x="79" y="517" text-anchor="start">Who decides, on what conditions?</text><text class="node-text" x="79" y="539" text-anchor="start">Keep the reasons for the choice</text><path class="edge" marker-end="url(#arrow)" d="M355,507 L430,507"/><rect class="node blue" x="440" y="455" width="300" height="105"/><rect x="440" y="455" width="8" height="105" rx="4" fill="#2563EB"/><text class="node-title" x="464" y="489" text-anchor="start">Commit</text><text class="node-text" x="464" y="517" text-anchor="start">How does reality change?</text><text class="node-text" x="464" y="539" text-anchor="start">Through the commit gate</text><path class="edge" marker-end="url(#arrow)" d="M740,507 L815,507"/><rect class="node teal" x="825" y="455" width="300" height="105"/><rect x="825" y="455" width="8" height="105" rx="4" fill="#0F766E"/><text class="node-title" x="849" y="489" text-anchor="start">Receipt &amp; lessons</text><text class="node-text" x="849" y="517" text-anchor="start">Did reality really change?</text><text class="node-text" x="849" y="539" text-anchor="start">Produce receipt and lessons</text><rect x="80" y="640" width="290" height="30" rx="15" fill="#7C3AED"/><text class="pill" x="225.0" y="660" text-anchor="middle">A task is not one command</text><rect x="455" y="640" width="290" height="30" rx="15" fill="#2563EB"/><text class="pill" x="600.0" y="660" text-anchor="middle">Done is not one status word</text><rect x="830" y="640" width="290" height="30" rx="15" fill="#0F766E"/><text class="pill" x="975.0" y="660" text-anchor="middle">Only a receipt proves the change</text></svg>