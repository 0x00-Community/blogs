<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><style>
.bg{fill:#F7F9FC}.title{font:700 28px sans-serif;fill:#1F2937}.sub{font:400 16px sans-serif;fill:#64748B}.node{stroke:#CBD5E1;stroke-width:2;rx:14;fill:#FFFFFF}.blue{fill:#EFF6FF;stroke:#93C5FD}.teal{fill:#ECFDF5;stroke:#6EE7B7}.amber{fill:#FFFBEB;stroke:#FCD34D}.red{fill:#FEF2F2;stroke:#FCA5A5}.purple{fill:#F5F3FF;stroke:#C4B5FD}.node-title{font:700 18px sans-serif;fill:#1F2937}.node-text{font:400 14px sans-serif;fill:#64748B}.label{font:700 14px sans-serif;fill:#1F2937}.small{font:400 12px sans-serif;fill:#64748B}.edge{stroke:#2563EB;stroke-width:3;fill:none}.edge-muted{stroke:#CBD5E1;stroke-width:3;fill:none}.dashed{stroke-dasharray:8 7}.pill{font:700 13px sans-serif;fill:#FFFFFF}
</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563EB"/></marker><marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#CBD5E1"/></marker></defs><rect class="bg" width="1200" height="720"/><text class="title" x="48" y="52">EP05｜Agent 把一件事办成的九个阶段</text><text class="sub" x="48" y="82">不是 Prompt 直接变动作，而是从意图到现实回执的一条可验证链路。</text><rect class="node purple" x="55" y="145" width="300" height="105"/><rect x="55" y="145" width="8" height="105" rx="4" fill="#7C3AED"/><text class="node-title" x="79" y="179" text-anchor="start">意图澄清</text><text class="node-text" x="79" y="207" text-anchor="start">到底要改变什么？</text><text class="node-text" x="79" y="229" text-anchor="start">澄清对象与验收</text><path class="edge" marker-end="url(#arrow)" d="M355,197 L430,197"/><rect class="node blue" x="440" y="145" width="300" height="105"/><rect x="440" y="145" width="8" height="105" rx="4" fill="#2563EB"/><text class="node-title" x="464" y="179" text-anchor="start">任务结构</text><text class="node-text" x="464" y="207" text-anchor="start">把目标版本化</text><text class="node-text" x="464" y="229" text-anchor="start">记录约束与证据</text><path class="edge" marker-end="url(#arrow)" d="M740,197 L815,197"/><rect class="node teal" x="825" y="145" width="300" height="105"/><rect x="825" y="145" width="8" height="105" rx="4" fill="#0F766E"/><text class="node-title" x="849" y="179" text-anchor="start">能力编译</text><text class="node-text" x="849" y="207" text-anchor="start">需要什么能力？</text><text class="node-text" x="849" y="229" text-anchor="start">按任务申请权限</text><path class="edge-muted dashed" marker-end="url(#arrow-muted)" d="M975,250 L975,275 L205,275 L205,290"/><rect class="node purple" x="55" y="300" width="300" height="105"/><rect x="55" y="300" width="8" height="105" rx="4" fill="#7C3AED"/><text class="node-title" x="79" y="334" text-anchor="start">规划与分支</text><text class="node-text" x="79" y="362" text-anchor="start">改变哪些变量？</text><text class="node-text" x="79" y="384" text-anchor="start">何时停止探索</text><path class="edge" marker-end="url(#arrow)" d="M355,352 L430,352"/><rect class="node blue" x="440" y="300" width="300" height="105"/><rect x="440" y="300" width="8" height="105" rx="4" fill="#2563EB"/><text class="node-title" x="464" y="334" text-anchor="start">受控执行</text><text class="node-text" x="464" y="362" text-anchor="start">错误隔离在哪里？</text><text class="node-text" x="464" y="384" text-anchor="start">不直接碰现实</text><path class="edge" marker-end="url(#arrow)" d="M740,352 L815,352"/><rect class="node teal" x="825" y="300" width="300" height="105"/><rect x="825" y="300" width="8" height="105" rx="4" fill="#0F766E"/><text class="node-title" x="849" y="334" text-anchor="start">验证</text><text class="node-text" x="849" y="362" text-anchor="start">候选是否有效？</text><text class="node-text" x="849" y="384" text-anchor="start">确定性检查是否通过</text><path class="edge-muted dashed" marker-end="url(#arrow-muted)" d="M975,405 L975,430 L205,430 L205,445"/><rect class="node purple" x="55" y="455" width="300" height="105"/><rect x="55" y="455" width="8" height="105" rx="4" fill="#7C3AED"/><text class="node-title" x="79" y="489" text-anchor="start">选择</text><text class="node-text" x="79" y="517" text-anchor="start">谁在条件下决定？</text><text class="node-text" x="79" y="539" text-anchor="start">保留选择依据</text><path class="edge" marker-end="url(#arrow)" d="M355,507 L430,507"/><rect class="node blue" x="440" y="455" width="300" height="105"/><rect x="440" y="455" width="8" height="105" rx="4" fill="#2563EB"/><text class="node-title" x="464" y="489" text-anchor="start">提交</text><text class="node-text" x="464" y="517" text-anchor="start">如何改变现实？</text><text class="node-text" x="464" y="539" text-anchor="start">经过提交门</text><path class="edge" marker-end="url(#arrow)" d="M740,507 L815,507"/><rect class="node teal" x="825" y="455" width="300" height="105"/><rect x="825" y="455" width="8" height="105" rx="4" fill="#0F766E"/><text class="node-title" x="849" y="489" text-anchor="start">回执与经验回流</text><text class="node-text" x="849" y="517" text-anchor="start">现实真的变了吗？</text><text class="node-text" x="849" y="539" text-anchor="start">形成回执与经验</text><rect x="80" y="640" width="290" height="30" rx="15" fill="#7C3AED"/><text class="pill" x="225.0" y="660" text-anchor="middle">任务不是一句命令</text><rect x="455" y="640" width="290" height="30" rx="15" fill="#2563EB"/><text class="pill" x="600.0" y="660" text-anchor="middle">完成不是一句状态</text><rect x="830" y="640" width="290" height="30" rx="15" fill="#0F766E"/><text class="pill" x="975.0" y="660" text-anchor="middle">回执才证明现实变化</text></svg>