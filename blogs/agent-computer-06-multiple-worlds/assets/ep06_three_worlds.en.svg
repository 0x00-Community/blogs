<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><style>
.bg{fill:#F7F9FC}.title{font:700 28px sans-serif;fill:#1F2937}.sub{font:400 16px sans-serif;fill:#64748B}.node{stroke:#CBD5E1;stroke-width:2;rx:14;fill:#FFFFFF}.blue{fill:#EFF6FF;stroke:#93C5FD}.teal{fill:#ECFDF5;stroke:#6EE7B7}.amber{fill:#FFFBEB;stroke:#FCD34D}.red{fill:#FEF2F2;stroke:#FCA5A5}.purple{fill:#F5F3FF;stroke:#C4B5FD}.node-title{font:700 18px sans-serif;fill:#1F2937}.node-text{font:400 14px sans-serif;fill:#64748B}.label{font:700 14px sans-serif;fill:#1F2937}.small{font:400 12px sans-serif;fill:#64748B}.edge{stroke:#2563EB;stroke-width:3;fill:none}.edge-muted{stroke:#CBD5E1;stroke-width:3;fill:none}.dashed{stroke-dasharray:8 7}.pill{font:700 13px sans-serif;fill:#FFFFFF}
</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563EB"/></marker><marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#CBD5E1"/></marker></defs><rect class="bg" width="1200" height="720"/><text class="title" x="48" y="52">EP06 | Many worldlines, one reality</text><text class="sub" x="48" y="82">Layer hypotheses, candidates, commit plans and real-world facts, so exploration can fail without reality going out of control.</text><rect class="node blue" x="60" y="155" width="315" height="155"/><rect x="60" y="155" width="8" height="155" rx="4" fill="#2563EB"/><text class="node-title" x="84" y="189" text-anchor="start">Exploration: may fail</text><text class="node-text" x="84" y="217" text-anchor="start">Sandbox, shadow lines, simulation</text><text class="node-text" x="84" y="239" text-anchor="start">High branching, few side effects</text><text class="node-text" x="84" y="261" text-anchor="start">Produces candidates and evidence</text><rect class="node amber" x="445" y="155" width="315" height="155"/><rect x="445" y="155" width="8" height="155" rx="4" fill="#B45309"/><text class="node-title" x="469" y="189" text-anchor="start">Commit: must verify</text><text class="node-text" x="469" y="217" text-anchor="start">Diff, regression, acceptance</text><text class="node-text" x="469" y="239" text-anchor="start">Permission review, prepare</text><text class="node-text" x="469" y="261" text-anchor="start">Awaits selection and authorization</text><rect class="node red" x="830" y="155" width="315" height="155"/><rect x="830" y="155" width="8" height="155" rx="4" fill="#B91C1C"/><text class="node-title" x="854" y="189" text-anchor="start">Reality: stays single</text><text class="node-text" x="854" y="217" text-anchor="start">External APIs, releases, payments</text><text class="node-text" x="854" y="239" text-anchor="start">Device actions, production changes</text><text class="node-text" x="854" y="261" text-anchor="start">Accepts only verified commits</text><path class="edge" marker-end="url(#arrow)" d="M375,232 L441,232"/><path class="edge" marker-end="url(#arrow)" d="M760,232 L826,232"/><rect class="node purple" x="150" y="435" width="270" height="105"/><rect x="150" y="435" width="8" height="105" rx="4" fill="#7C3AED"/><text class="node-title" x="174" y="469" text-anchor="start">Snapshot and rollback</text><text class="node-text" x="174" y="497" text-anchor="start">Digital state can be rolled back</text><text class="node-text" x="174" y="519" text-anchor="start">Reality is not undone with it</text><rect class="node amber" x="465" y="435" width="270" height="105"/><rect x="465" y="435" width="8" height="105" rx="4" fill="#B45309"/><text class="node-title" x="489" y="469" text-anchor="start">Compensate, reconcile</text><text class="node-text" x="489" y="497" text-anchor="start">Compensation is a new real action</text><text class="node-text" x="489" y="519" text-anchor="start">No auto-retry on unknown state</text><rect class="node teal" x="780" y="435" width="270" height="105"/><rect x="780" y="435" width="8" height="105" rx="4" fill="#0F766E"/><text class="node-title" x="804" y="469" text-anchor="start">Effect Receipt</text><text class="node-text" x="804" y="497" text-anchor="start">Ext. receipt + trusted observation</text><text class="node-text" x="804" y="519" text-anchor="start">Forms a fact about reality</text><path class="edge" marker-end="url(#arrow)" d="M420,487 L461,487"/><path class="edge" marker-end="url(#arrow)" d="M735,487 L776,487"/><rect x="95" y="620" width="300" height="30" rx="15" fill="#2563EB"/><text class="pill" x="245.0" y="640" text-anchor="middle">Many worlds, not many realities</text><rect x="455" y="620" width="300" height="30" rx="15" fill="#B91C1C"/><text class="pill" x="605.0" y="640" text-anchor="middle">Commit gate keeps reality single</text><rect x="815" y="620" width="300" height="30" rx="15" fill="#0F766E"/><text class="pill" x="965.0" y="640" text-anchor="middle">Takeaway: exploration may fail</text></svg>