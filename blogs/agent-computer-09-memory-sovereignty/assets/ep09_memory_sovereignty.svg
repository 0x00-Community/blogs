<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><style>
.bg{fill:#F7F9FC}.title{font:700 28px sans-serif;fill:#1F2937}.sub{font:400 16px sans-serif;fill:#64748B}.node{stroke:#CBD5E1;stroke-width:2;rx:14;fill:#FFFFFF}.blue{fill:#EFF6FF;stroke:#93C5FD}.teal{fill:#ECFDF5;stroke:#6EE7B7}.amber{fill:#FFFBEB;stroke:#FCD34D}.red{fill:#FEF2F2;stroke:#FCA5A5}.purple{fill:#F5F3FF;stroke:#C4B5FD}.node-title{font:700 18px sans-serif;fill:#1F2937}.node-text{font:400 14px sans-serif;fill:#64748B}.label{font:700 14px sans-serif;fill:#1F2937}.small{font:400 12px sans-serif;fill:#64748B}.edge{stroke:#2563EB;stroke-width:3;fill:none}.edge-muted{stroke:#CBD5E1;stroke-width:3;fill:none}.dashed{stroke-dasharray:8 7}.pill{font:700 13px sans-serif;fill:#FFFFFF}
</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563EB"/></marker><marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#CBD5E1"/></marker></defs><rect class="bg" width="1200" height="720"/><text class="title" x="48" y="52">EP09｜从记忆系统到智能主权</text><text class="sub" x="48" y="82">AI 记住你，只是保存或召回信息；真正的拥有需要可见、可纠正、可撤销、可删除和可审计。</text><rect class="node blue" x="55" y="150" width="220" height="120"/><rect x="55" y="150" width="8" height="120" rx="4" fill="#2563EB"/><text class="node-title" x="79" y="184" text-anchor="start">事实记忆</text><text class="node-text" x="79" y="212" text-anchor="start">身份、历史事实</text><text class="node-text" x="79" y="234" text-anchor="start">来源、时间、置信度</text><rect class="node teal" x="330" y="150" width="220" height="120"/><rect x="330" y="150" width="8" height="120" rx="4" fill="#0F766E"/><text class="node-title" x="354" y="184" text-anchor="start">偏好记忆</text><text class="node-text" x="354" y="212" text-anchor="start">表达与选择偏好</text><text class="node-text" x="354" y="234" text-anchor="start">可确认、可纠正</text><rect class="node purple" x="605" y="150" width="220" height="120"/><rect x="605" y="150" width="8" height="120" rx="4" fill="#7C3AED"/><text class="node-title" x="629" y="184" text-anchor="start">策略记忆</text><text class="node-text" x="629" y="212" text-anchor="start">做事方法与约束</text><text class="node-text" x="629" y="234" text-anchor="start">不等于授权事实</text><rect class="node amber" x="880" y="150" width="260" height="120"/><rect x="880" y="150" width="8" height="120" rx="4" fill="#B45309"/><text class="node-title" x="904" y="184" text-anchor="start">任务经验</text><text class="node-text" x="904" y="212" text-anchor="start">成功、失败、边界</text><text class="node-text" x="904" y="234" text-anchor="start">条件化复用</text><path class="edge" marker-end="url(#arrow)" d="M275,210 L326,210"/><path class="edge" marker-end="url(#arrow)" d="M550,210 L601,210"/><path class="edge" marker-end="url(#arrow)" d="M825,210 L876,210"/><rect class="node blue" x="145" y="420" width="250" height="110"/><rect x="145" y="420" width="8" height="110" rx="4" fill="#2563EB"/><text class="node-title" x="169" y="454" text-anchor="start">可见与可纠正</text><text class="node-text" x="169" y="482" text-anchor="start">用户知道系统记了什么</text><text class="node-text" x="169" y="504" text-anchor="start">可以修正错误理解</text><rect class="node red" x="475" y="420" width="250" height="110"/><rect x="475" y="420" width="8" height="110" rx="4" fill="#B91C1C"/><text class="node-title" x="499" y="454" text-anchor="start">可撤销与可删除</text><text class="node-text" x="499" y="482" text-anchor="start">停止使用不等于删除</text><text class="node-text" x="499" y="504" text-anchor="start">失败时如实回执</text><rect class="node teal" x="805" y="420" width="250" height="110"/><rect x="805" y="420" width="8" height="110" rx="4" fill="#0F766E"/><text class="node-title" x="829" y="454" text-anchor="start">主权边界</text><text class="node-text" x="829" y="482" text-anchor="start">数据、模型、记忆</text><text class="node-text" x="829" y="504" text-anchor="start">策略、设备分别治理</text><path class="edge" marker-end="url(#arrow)" d="M395,475 L471,475"/><path class="edge" marker-end="url(#arrow)" d="M725,475 L801,475"/><rect x="90" y="625" width="300" height="30" rx="15" fill="#B45309"/><text class="pill" x="240.0" y="645" text-anchor="middle">召回命中 ≠ 对用户有用</text><rect x="450" y="625" width="300" height="30" rx="15" fill="#7C3AED"/><text class="pill" x="600.0" y="645" text-anchor="middle">影子助手理解你，但不冒充你</text><rect x="810" y="625" width="300" height="30" rx="15" fill="#0F766E"/><text class="pill" x="960.0" y="645" text-anchor="middle">记忆只有可治理才属于你</text></svg>