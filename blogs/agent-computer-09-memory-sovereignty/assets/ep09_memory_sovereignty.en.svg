<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><style>
.bg{fill:#F7F9FC}.title{font:700 28px sans-serif;fill:#1F2937}.sub{font:400 16px sans-serif;fill:#64748B}.node{stroke:#CBD5E1;stroke-width:2;rx:14;fill:#FFFFFF}.blue{fill:#EFF6FF;stroke:#93C5FD}.teal{fill:#ECFDF5;stroke:#6EE7B7}.amber{fill:#FFFBEB;stroke:#FCD34D}.red{fill:#FEF2F2;stroke:#FCA5A5}.purple{fill:#F5F3FF;stroke:#C4B5FD}.node-title{font:700 18px sans-serif;fill:#1F2937}.node-text{font:400 14px sans-serif;fill:#64748B}.label{font:700 14px sans-serif;fill:#1F2937}.small{font:400 12px sans-serif;fill:#64748B}.edge{stroke:#2563EB;stroke-width:3;fill:none}.edge-muted{stroke:#CBD5E1;stroke-width:3;fill:none}.dashed{stroke-dasharray:8 7}.pill{font:700 13px sans-serif;fill:#FFFFFF}
</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563EB"/></marker><marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#CBD5E1"/></marker></defs><rect class="bg" width="1200" height="720"/><text class="title" x="48" y="52">EP09 | From memory systems to intelligence sovereignty</text><text class="sub" x="48" y="82">Remembering you is only storing or recalling; owning memory means it is visible, correctable, revocable, deletable and auditable.</text><rect class="node blue" x="55" y="150" width="220" height="120"/><rect x="55" y="150" width="8" height="120" rx="4" fill="#2563EB"/><text class="node-title" x="79" y="184" text-anchor="start">Fact memory</text><text class="node-text" x="79" y="212" text-anchor="start">Identity, past facts</text><text class="node-text" x="79" y="234" text-anchor="start">Source, time, confidence</text><rect class="node teal" x="330" y="150" width="220" height="120"/><rect x="330" y="150" width="8" height="120" rx="4" fill="#0F766E"/><text class="node-title" x="354" y="184" text-anchor="start">Preference memory</text><text class="node-text" x="354" y="212" text-anchor="start">Expression and choices</text><text class="node-text" x="354" y="234" text-anchor="start">Confirmable, correctable</text><rect class="node purple" x="605" y="150" width="220" height="120"/><rect x="605" y="150" width="8" height="120" rx="4" fill="#7C3AED"/><text class="node-title" x="629" y="184" text-anchor="start">Policy memory</text><text class="node-text" x="629" y="212" text-anchor="start">Methods and constraints</text><text class="node-text" x="629" y="234" text-anchor="start">Not proof of authorization</text><rect class="node amber" x="880" y="150" width="260" height="120"/><rect x="880" y="150" width="8" height="120" rx="4" fill="#B45309"/><text class="node-title" x="904" y="184" text-anchor="start">Task experience</text><text class="node-text" x="904" y="212" text-anchor="start">Successes, failures, limits</text><text class="node-text" x="904" y="234" text-anchor="start">Conditioned reuse</text><path class="edge" marker-end="url(#arrow)" d="M275,210 L326,210"/><path class="edge" marker-end="url(#arrow)" d="M550,210 L601,210"/><path class="edge" marker-end="url(#arrow)" d="M825,210 L876,210"/><rect class="node blue" x="145" y="420" width="250" height="110"/><rect x="145" y="420" width="8" height="110" rx="4" fill="#2563EB"/><text class="node-title" x="169" y="454" text-anchor="start">Visible, correctable</text><text class="node-text" x="169" y="482" text-anchor="start">Users see what is remembered</text><text class="node-text" x="169" y="504" text-anchor="start">and can fix wrong inferences</text><rect class="node red" x="475" y="420" width="250" height="110"/><rect x="475" y="420" width="8" height="110" rx="4" fill="#B91C1C"/><text class="node-title" x="499" y="454" text-anchor="start">Revocable, deletable</text><text class="node-text" x="499" y="482" text-anchor="start">Stopping use is not deletion</text><text class="node-text" x="499" y="504" text-anchor="start">Failures reported honestly</text><rect class="node teal" x="805" y="420" width="250" height="110"/><rect x="805" y="420" width="8" height="110" rx="4" fill="#0F766E"/><text class="node-title" x="829" y="454" text-anchor="start">Sovereignty boundary</text><text class="node-text" x="829" y="482" text-anchor="start">Data, model, memory, policy</text><text class="node-text" x="829" y="504" text-anchor="start">and device, governed apart</text><path class="edge" marker-end="url(#arrow)" d="M395,475 L471,475"/><path class="edge" marker-end="url(#arrow)" d="M725,475 L801,475"/><rect x="90" y="625" width="300" height="30" rx="15" fill="#B45309"/><text class="pill" x="240.0" y="645" text-anchor="middle">A recall hit ≠ useful to the user</text><rect x="450" y="625" width="300" height="30" rx="15" fill="#7C3AED"/><text class="pill" x="600.0" y="645" text-anchor="middle">A shadow assistant never poses as you</text><rect x="810" y="625" width="300" height="30" rx="15" fill="#0F766E"/><text class="pill" x="960.0" y="645" text-anchor="middle">Memory is yours only if governable</text></svg>