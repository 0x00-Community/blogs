<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><style>
.bg{fill:#F7F9FC}.title{font:700 28px sans-serif;fill:#1F2937}.sub{font:400 16px sans-serif;fill:#64748B}.node{stroke:#CBD5E1;stroke-width:2;rx:14;fill:#FFFFFF}.blue{fill:#EFF6FF;stroke:#93C5FD}.teal{fill:#ECFDF5;stroke:#6EE7B7}.amber{fill:#FFFBEB;stroke:#FCD34D}.red{fill:#FEF2F2;stroke:#FCA5A5}.purple{fill:#F5F3FF;stroke:#C4B5FD}.node-title{font:700 18px sans-serif;fill:#1F2937}.node-text{font:400 14px sans-serif;fill:#64748B}.label{font:700 14px sans-serif;fill:#1F2937}.small{font:400 12px sans-serif;fill:#64748B}.edge{stroke:#2563EB;stroke-width:3;fill:none}.edge-muted{stroke:#CBD5E1;stroke-width:3;fill:none}.dashed{stroke-dasharray:8 7}.pill{font:700 13px sans-serif;fill:#FFFFFF}
</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563EB"/></marker><marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#CBD5E1"/></marker></defs><rect class="bg" width="1200" height="720"/><text class="title" x="48" y="52">EP08 | On-device AI competes on intelligence density</text><text class="sub" x="48" y="82">Parameter count is only the start; what a product delivers is stable task completion under limited resources.</text><rect class="node blue" x="55" y="150" width="220" height="110"/><rect x="55" y="150" width="8" height="110" rx="4" fill="#2563EB"/><text class="node-title" x="79" y="184" text-anchor="start">Model parameters</text><text class="node-text" x="79" y="212" text-anchor="start">Fits in memory</text><text class="node-text" x="79" y="234" text-anchor="start">does not mean it runs</text><rect class="node red" x="330" y="150" width="220" height="110"/><rect x="330" y="150" width="8" height="110" rx="4" fill="#B91C1C"/><text class="node-title" x="354" y="184" text-anchor="start">Memory, bandwidth</text><text class="node-text" x="354" y="212" text-anchor="start">Moving weights</text><text class="node-text" x="354" y="234" text-anchor="start">KV Cache</text><text class="node-text" x="354" y="256" text-anchor="start">Memory wall</text><rect class="node amber" x="605" y="150" width="220" height="110"/><rect x="605" y="150" width="8" height="110" rx="4" fill="#B45309"/><text class="node-title" x="629" y="184" text-anchor="start">System bill</text><text class="node-text" x="629" y="212" text-anchor="start">Power, heat</text><text class="node-text" x="629" y="234" text-anchor="start">Latency, cost</text><text class="node-text" x="629" y="256" text-anchor="start">Long-run stability</text><rect class="node teal" x="880" y="150" width="260" height="110"/><rect x="880" y="150" width="8" height="110" rx="4" fill="#0F766E"/><text class="node-title" x="904" y="184" text-anchor="start">Effective task intelligence</text><text class="node-text" x="904" y="212" text-anchor="start">Quality and reliability</text><text class="node-text" x="904" y="234" text-anchor="start">Sustained delivery per unit cost</text><path class="edge" marker-end="url(#arrow)" d="M275,205 L326,205"/><path class="edge" marker-end="url(#arrow)" d="M550,205 L601,205"/><path class="edge" marker-end="url(#arrow)" d="M825,205 L876,205"/><rect class="node purple" x="120" y="410" width="260" height="105"/><rect x="120" y="410" width="8" height="105" rx="4" fill="#7C3AED"/><text class="node-title" x="144" y="444" text-anchor="start">Phased task scheduling</text><text class="node-text" x="144" y="472" text-anchor="start">Simple task: one model</text><text class="node-text" x="144" y="494" text-anchor="start">Complex task: staged resources</text><rect class="node blue" x="470" y="410" width="260" height="105"/><rect x="470" y="410" width="8" height="105" rx="4" fill="#2563EB"/><text class="node-title" x="494" y="444" text-anchor="start">NPU Runtime</text><text class="node-text" x="494" y="472" text-anchor="start">Hardware must actually deliver</text><text class="node-text" x="494" y="494" text-anchor="start">Judged by the real runtime</text><rect class="node teal" x="820" y="410" width="260" height="105"/><rect x="820" y="410" width="8" height="105" rx="4" fill="#0F766E"/><text class="node-title" x="844" y="444" text-anchor="start">User control domain</text><text class="node-text" x="844" y="472" text-anchor="start">Local memory, perms, deletion</text><text class="node-text" x="844" y="494" text-anchor="start">On-device first: beyond offline</text><path class="edge" marker-end="url(#arrow)" d="M380,462 L466,462"/><path class="edge" marker-end="url(#arrow)" d="M730,462 L816,462"/><rect x="90" y="620" width="310" height="30" rx="15" fill="#B45309"/><text class="pill" x="245.0" y="640" text-anchor="middle">1667 ops/byte: illustrative example only</text><rect x="445" y="620" width="330" height="30" rx="15" fill="#B91C1C"/><text class="pill" x="610.0" y="640" text-anchor="middle">Fits in memory ≠ delivers reliably</text><rect x="820" y="620" width="300" height="30" rx="15" fill="#0F766E"/><text class="pill" x="970.0" y="640" text-anchor="middle">Intelligence density = system outcome</text></svg>