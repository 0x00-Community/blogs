</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563EB"/></marker><marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#CBD5E1"/></marker></defs><rect class="bg" width="1200" height="720"/><text class="title" x="48" y="52">EP08｜端侧 AI 比的是智能密度</text><text class="sub" x="48" y="82">参数规模只是起点；产品最终交付的是受限资源下稳定完成任务的能力。</text><rect class="node blue" x="55" y="150" width="220" height="110"/><rect x="55" y="150" width="8" height="110" rx="4" fill="#2563EB"/><text class="node-title" x="79" y="184" text-anchor="start">模型参数</text><text class="node-text" x="79" y="212" text-anchor="start">能装下</text><text class="node-text" x="79" y="234" text-anchor="start">不等于能运行</text><rect class="node red" x="330" y="150" width="220" height="110"/><rect x="330" y="150" width="8" height="110" rx="4" fill="#B91C1C"/><text class="node-title" x="354" y="184" text-anchor="start">内存与带宽</text><text class="node-text" x="354" y="212" text-anchor="start">权重搬运</text><text class="node-text" x="354" y="234" text-anchor="start">KV Cache</text><text class="node-text" x="354" y="256" text-anchor="start">内存墙</text><rect class="node amber" x="605" y="150" width="220" height="110"/><rect x="605" y="150" width="8" height="110" rx="4" fill="#B45309"/><text class="node-title" x="629" y="184" text-anchor="start">系统账单</text><text class="node-text" x="629" y="212" text-anchor="start">功耗、散热</text><text class="node-text" x="629" y="234" text-anchor="start">时延、成本</text><text class="node-text" x="629" y="256" text-anchor="start">长期稳定性</text><rect class="node teal" x="880" y="150" width="260" height="110"/><rect x="880" y="150" width="8" height="110" rx="4" fill="#0F766E"/><text class="node-title" x="904" y="184" text-anchor="start">有效任务智能</text><text class="node-text" x="904" y="212" text-anchor="start">质量与可靠性</text><text class="node-text" x="904" y="234" text-anchor="start">单位成本的持续交付</text><path class="edge" marker-end="url(#arrow)" d="M275,205 L326,205"/><path class="edge" marker-end="url(#arrow)" d="M550,205 L601,205"/><path class="edge" marker-end="url(#arrow)" d="M825,205 L876,205"/><rect class="node purple" x="120" y="410" width="260" height="105"/><rect x="120" y="410" width="8" height="105" rx="4" fill="#7C3AED"/><text class="node-title" x="144" y="444" text-anchor="start">任务分段调度</text><text class="node-text" x="144" y="472" text-anchor="start">简单任务退化为单模型</text><text class="node-text" x="144" y="494" text-anchor="start">复杂任务按阶段分配资源</text><rect class="node blue" x="470" y="410" width="260" height="105"/><rect x="470" y="410" width="8" height="105" rx="4" fill="#2563EB"/><text class="node-title" x="494" y="444" text-anchor="start">NPU Runtime</text><text class="node-text" x="494" y="472" text-anchor="start">硬件能力必须被兑现</text><text class="node-text" x="494" y="494" text-anchor="start">以真实运行时为准</text><rect class="node teal" x="820" y="410" width="260" height="105"/><rect x="820" y="410" width="8" height="105" rx="4" fill="#0F766E"/><text class="node-title" x="844" y="444" text-anchor="start">用户控制域</text><text class="node-text" x="844" y="472" text-anchor="start">本地记忆、权限、删除</text><text class="node-text" x="844" y="494" text-anchor="start">端侧优先不只是离线</text><path class="edge" marker-end="url(#arrow)" d="M380,462 L466,462"/><path class="edge" marker-end="url(#arrow)" d="M730,462 L816,462"/><rect x="90" y="620" width="310" height="30" rx="15" fill="#B45309"/><text class="pill" x="245.0" y="640" text-anchor="middle">1667 ops/byte：解释性量纲示例</text><rect x="445" y="620" width="330" height="30" rx="15" fill="#B91C1C"/><text class="pill" x="610.0" y="640" text-anchor="middle">能装下 ≠ 能稳定交付</text><rect x="820" y="620" width="300" height="30" rx="15" fill="#0F766E"/><text class="pill" x="970.0" y="640" text-anchor="middle">智能密度 = 系统级结果</text></svg>