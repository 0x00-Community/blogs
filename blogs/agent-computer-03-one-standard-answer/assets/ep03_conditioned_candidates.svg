<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><style>
.bg{fill:#F7F9FC}.title{font:700 28px sans-serif;fill:#1F2937}.sub{font:400 16px sans-serif;fill:#64748B}.node{stroke:#CBD5E1;stroke-width:2;rx:14;fill:#FFFFFF}.blue{fill:#EFF6FF;stroke:#93C5FD}.teal{fill:#ECFDF5;stroke:#6EE7B7}.amber{fill:#FFFBEB;stroke:#FCD34D}.red{fill:#FEF2F2;stroke:#FCA5A5}.purple{fill:#F5F3FF;stroke:#C4B5FD}.node-title{font:700 18px sans-serif;fill:#1F2937}.node-text{font:400 14px sans-serif;fill:#64748B}.label{font:700 14px sans-serif;fill:#1F2937}.small{font:400 12px sans-serif;fill:#64748B}.edge{stroke:#2563EB;stroke-width:3;fill:none}.edge-muted{stroke:#CBD5E1;stroke-width:3;fill:none}.dashed{stroke-dasharray:8 7}.pill{font:700 13px sans-serif;fill:#FFFFFF}
</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563EB"/></marker><marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#CBD5E1"/></marker></defs><rect class="bg" width="1200" height="720"/><text class="title" x="48" y="52">EP03｜自由选择计算不是更多答案</text><text class="sub" x="48" y="82">候选必须附带条件、证据和选择依据，并经过两道门。</text><rect class="node purple" x="60" y="150" width="210" height="125"/><rect x="60" y="150" width="8" height="125" rx="4" fill="#7C3AED"/><text class="node-title" x="84" y="184" text-anchor="start">任务 Spec</text><text class="node-text" x="84" y="212" text-anchor="start">目标、约束、偏好</text><text class="node-text" x="84" y="234" text-anchor="start">事实与证据</text><text class="node-text" x="84" y="256" text-anchor="start">未解决的不确定性</text><rect class="node blue" x="330" y="150" width="210" height="125"/><rect x="330" y="150" width="8" height="125" rx="4" fill="#2563EB"/><text class="node-title" x="354" y="184" text-anchor="start">受控探索</text><text class="node-text" x="354" y="212" text-anchor="start">主线与影子线</text><text class="node-text" x="354" y="234" text-anchor="start">只改变关键变量</text><text class="node-text" x="354" y="256" text-anchor="start">记录成本与失败边界</text><rect class="node teal" x="600" y="150" width="210" height="125"/><rect x="600" y="150" width="8" height="125" rx="4" fill="#0F766E"/><text class="node-title" x="624" y="184" text-anchor="start">候选集合</text><text class="node-text" x="624" y="212" text-anchor="start">有限、可比较</text><text class="node-text" x="624" y="234" text-anchor="start">附带适用条件</text><text class="node-text" x="624" y="256" text-anchor="start">不是答案列表</text><rect class="node amber" x="870" y="150" width="260" height="125"/><rect x="870" y="150" width="8" height="125" rx="4" fill="#B45309"/><text class="node-title" x="894" y="184" text-anchor="start">选择与提交</text><text class="node-text" x="894" y="212" text-anchor="start">谁在什么条件下选</text><text class="node-text" x="894" y="234" text-anchor="start">独立授权</text><text class="node-text" x="894" y="256" text-anchor="start">外部回执</text><path class="edge" marker-end="url(#arrow)" d="M270,212 L326,212"/><path class="edge" marker-end="url(#arrow)" d="M540,212 L596,212"/><path class="edge" marker-end="url(#arrow)" d="M810,212 L866,212"/><rect class="node red" x="220" y="410" width="290" height="130"/><rect x="220" y="410" width="8" height="130" rx="4" fill="#B91C1C"/><text class="node-title" x="244" y="444" text-anchor="start">有效性门</text><text class="node-text" x="244" y="472" text-anchor="start">事实与逻辑底线</text><text class="node-text" x="244" y="494" text-anchor="start">安全、法律、权限</text><text class="node-text" x="244" y="516" text-anchor="start">不能把未知写成确定</text><rect class="node amber" x="690" y="410" width="290" height="130"/><rect x="690" y="410" width="8" height="130" rx="4" fill="#B45309"/><text class="node-title" x="714" y="444" text-anchor="start">场景适配门</text><text class="node-text" x="714" y="472" text-anchor="start">当前时间、预算、设备</text><text class="node-text" x="714" y="494" text-anchor="start">风险偏好与验收</text><text class="node-text" x="714" y="516" text-anchor="start">现在是否适合选择</text><path class="edge" marker-end="url(#arrow)" d="M435,277 L365,406"/><path class="edge-muted dashed" marker-end="url(#arrow-muted)" d="M435,277 L835,406"/><text class="label" x="370" y="350" text-anchor="start">进入候选</text><text class="label" x="760" y="350" text-anchor="start">当前选择</text><rect x="90" y="620" width="280" height="30" rx="15" fill="#B91C1C"/><text class="pill" x="230.0" y="640" text-anchor="middle">无效：不能成为候选</text><rect x="450" y="620" width="300" height="30" rx="15" fill="#B45309"/><text class="pill" x="600.0" y="640" text-anchor="middle">有效但不适配：保留条件</text><rect x="780" y="620" width="300" height="30" rx="15" fill="#0F766E"/><text class="pill" x="930.0" y="640" text-anchor="middle">要点：帮用户组织选择</text></svg>