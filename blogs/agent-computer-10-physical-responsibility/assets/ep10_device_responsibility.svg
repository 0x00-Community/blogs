</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563EB"/></marker><marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#CBD5E1"/></marker></defs><rect class="bg" width="1200" height="720"/><text class="title" x="48" y="52">EP10｜从设备连接到现实责任</text><text class="sub" x="48" y="82">插入不等于授权，识别不等于信任，绑定不等于全权；现实结果必须有外部回执。</text><rect class="node blue" x="45" y="175" width="135" height="105"/><rect x="45" y="175" width="8" height="105" rx="4" fill="#2563EB"/><text class="node-title" x="69" y="209" text-anchor="start">发现</text><text class="node-text" x="69" y="237" text-anchor="start">看见设备与能力</text><path class="edge" marker-end="url(#arrow)" d="M180,238 L202,238"/><rect class="node purple" x="210" y="175" width="135" height="105"/><rect x="210" y="175" width="8" height="105" rx="4" fill="#7C3AED"/><text class="node-title" x="234" y="209" text-anchor="start">识别</text><text class="node-text" x="234" y="237" text-anchor="start">证明主体与身份</text><path class="edge" marker-end="url(#arrow)" d="M345,238 L367,238"/><rect class="node amber" x="375" y="175" width="135" height="105"/><rect x="375" y="175" width="8" height="105" rx="4" fill="#B45309"/><text class="node-title" x="399" y="209" text-anchor="start">绑定</text><text class="node-text" x="399" y="237" text-anchor="start">建立受控关系</text><path class="edge" marker-end="url(#arrow)" d="M510,238 L532,238"/><rect class="node red" x="540" y="175" width="135" height="105"/><rect x="540" y="175" width="8" height="105" rx="4" fill="#B91C1C"/><text class="node-title" x="564" y="209" text-anchor="start">授权</text><text class="node-text" x="564" y="237" text-anchor="start">按能力与风险签发</text><path class="edge" marker-end="url(#arrow)" d="M675,238 L697,238"/><rect class="node teal" x="705" y="175" width="135" height="105"/><rect x="705" y="175" width="8" height="105" rx="4" fill="#0F766E"/><text class="node-title" x="729" y="209" text-anchor="start">验证</text><text class="node-text" x="729" y="237" text-anchor="start">检查条件与安全</text><path class="edge" marker-end="url(#arrow)" d="M840,238 L862,238"/><rect class="node red" x="870" y="175" width="135" height="105"/><rect x="870" y="175" width="8" height="105" rx="4" fill="#B91C1C"/><text class="node-title" x="894" y="209" text-anchor="start">提交</text><text class="node-text" x="894" y="237" text-anchor="start">执行现实动作</text><path class="edge" marker-end="url(#arrow)" d="M1005,238 L1027,238"/><rect class="node teal" x="1035" y="175" width="135" height="105"/><rect x="1035" y="175" width="8" height="105" rx="4" fill="#0F766E"/><text class="node-title" x="1059" y="209" text-anchor="start">回执</text><text class="node-text" x="1059" y="237" text-anchor="start">确认外部变化</text><rect class="node blue" x="150" y="430" width="270" height="110"/><rect x="150" y="430" width="8" height="110" rx="4" fill="#2563EB"/><text class="node-title" x="174" y="464" text-anchor="start">个人设备</text><text class="node-text" x="174" y="492" text-anchor="start">屏幕、打印、输入注入</text><text class="node-text" x="174" y="514" text-anchor="start">现实副作用仍然存在</text><rect class="node red" x="465" y="430" width="270" height="110"/><rect x="465" y="430" width="8" height="110" rx="4" fill="#B91C1C"/><text class="node-title" x="489" y="464" text-anchor="start">工业系统</text><text class="node-text" x="489" y="492" text-anchor="start">生成式探索不能替代</text><text class="node-text" x="489" y="514" text-anchor="start">确定性控制与独立安全</text><rect class="node amber" x="780" y="430" width="270" height="110"/><rect x="780" y="430" width="8" height="110" rx="4" fill="#B45309"/><text class="node-title" x="804" y="464" text-anchor="start">责任链</text><text class="node-text" x="804" y="492" text-anchor="start">模型、系统、操作组织</text><text class="node-text" x="804" y="514" text-anchor="start">提交代理、设备与回执</text><path class="edge" marker-end="url(#arrow)" d="M420,485 L461,485"/><path class="edge" marker-end="url(#arrow)" d="M735,485 L776,485"/><rect x="90" y="625" width="300" height="30" rx="15" fill="#B91C1C"/><text class="pill" x="240.0" y="645" text-anchor="middle">连接设备不是全权开关</text><rect x="445" y="625" width="315" height="30" rx="15" fill="#B45309"/><text class="pill" x="602.5" y="645" text-anchor="middle">补偿是新的现实动作</text><rect x="820" y="625" width="300" height="30" rx="15" fill="#0F766E"/><text class="pill" x="970.0" y="645" text-anchor="middle">未知回执时停止重试</text></svg>