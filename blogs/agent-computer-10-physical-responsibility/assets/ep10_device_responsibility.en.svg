<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><style>
.bg{fill:#F7F9FC}.title{font:700 28px sans-serif;fill:#1F2937}.sub{font:400 16px sans-serif;fill:#64748B}.node{stroke:#CBD5E1;stroke-width:2;rx:14;fill:#FFFFFF}.blue{fill:#EFF6FF;stroke:#93C5FD}.teal{fill:#ECFDF5;stroke:#6EE7B7}.amber{fill:#FFFBEB;stroke:#FCD34D}.red{fill:#FEF2F2;stroke:#FCA5A5}.purple{fill:#F5F3FF;stroke:#C4B5FD}.node-title{font:700 18px sans-serif;fill:#1F2937}.node-text{font:400 14px sans-serif;fill:#64748B}.label{font:700 14px sans-serif;fill:#1F2937}.small{font:400 12px sans-serif;fill:#64748B}.edge{stroke:#2563EB;stroke-width:3;fill:none}.edge-muted{stroke:#CBD5E1;stroke-width:3;fill:none}.dashed{stroke-dasharray:8 7}.pill{font:700 13px sans-serif;fill:#FFFFFF}
</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563EB"/></marker><marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#CBD5E1"/></marker></defs><rect class="bg" width="1200" height="720"/><text class="title" x="48" y="52">EP10 | From device connection to real-world responsibility</text><text class="sub" x="48" y="82">Plugging in is not authorization, recognition is not trust, binding is not full authority; real-world results need an external receipt.</text><rect class="node blue" x="45" y="175" width="135" height="105"/><rect x="45" y="175" width="8" height="105" rx="4" fill="#2563EB"/><text class="node-title" x="69" y="209" text-anchor="start">Discover</text><text class="node-text" x="69" y="237" text-anchor="start">Enumerate</text><path class="edge" marker-end="url(#arrow)" d="M180,238 L202,238"/><rect class="node purple" x="210" y="175" width="135" height="105"/><rect x="210" y="175" width="8" height="105" rx="4" fill="#7C3AED"/><text class="node-title" x="234" y="209" text-anchor="start">Identify</text><text class="node-text" x="234" y="237" text-anchor="start">Prove identity</text><path class="edge" marker-end="url(#arrow)" d="M345,238 L367,238"/><rect class="node amber" x="375" y="175" width="135" height="105"/><rect x="375" y="175" width="8" height="105" rx="4" fill="#B45309"/><text class="node-title" x="399" y="209" text-anchor="start">Bind</text><text class="node-text" x="399" y="237" text-anchor="start">Governed link</text><path class="edge" marker-end="url(#arrow)" d="M510,238 L532,238"/><rect class="node red" x="540" y="175" width="135" height="105"/><rect x="540" y="175" width="8" height="105" rx="4" fill="#B91C1C"/><text class="node-title" x="564" y="209" text-anchor="start">Authorize</text><text class="node-text" x="564" y="237" text-anchor="start">Per capability</text><path class="edge" marker-end="url(#arrow)" d="M675,238 L697,238"/><rect class="node teal" x="705" y="175" width="135" height="105"/><rect x="705" y="175" width="8" height="105" rx="4" fill="#0F766E"/><text class="node-title" x="729" y="209" text-anchor="start">Verify</text><text class="node-text" x="729" y="237" text-anchor="start">Check safety</text><path class="edge" marker-end="url(#arrow)" d="M840,238 L862,238"/><rect class="node red" x="870" y="175" width="135" height="105"/><rect x="870" y="175" width="8" height="105" rx="4" fill="#B91C1C"/><text class="node-title" x="894" y="209" text-anchor="start">Commit</text><text class="node-text" x="894" y="237" text-anchor="start">Real action</text><path class="edge" marker-end="url(#arrow)" d="M1005,238 L1027,238"/><rect class="node teal" x="1035" y="175" width="135" height="105"/><rect x="1035" y="175" width="8" height="105" rx="4" fill="#0F766E"/><text class="node-title" x="1059" y="209" text-anchor="start">Receipt</text><text class="node-text" x="1059" y="237" text-anchor="start">Confirm effect</text><rect class="node blue" x="150" y="430" width="270" height="110"/><rect x="150" y="430" width="8" height="110" rx="4" fill="#2563EB"/><text class="node-title" x="174" y="464" text-anchor="start">Personal devices</text><text class="node-text" x="174" y="492" text-anchor="start">Screen, print, input injection</text><text class="node-text" x="174" y="514" text-anchor="start">Real side effects still apply</text><rect class="node red" x="465" y="430" width="270" height="110"/><rect x="465" y="430" width="8" height="110" rx="4" fill="#B91C1C"/><text class="node-title" x="489" y="464" text-anchor="start">Industrial systems</text><text class="node-text" x="489" y="492" text-anchor="start">No substitute for deterministic</text><text class="node-text" x="489" y="514" text-anchor="start">control and independent safety</text><rect class="node amber" x="780" y="430" width="270" height="110"/><rect x="780" y="430" width="8" height="110" rx="4" fill="#B45309"/><text class="node-title" x="804" y="464" text-anchor="start">Responsibility chain</text><text class="node-text" x="804" y="492" text-anchor="start">Model, system, operating org,</text><text class="node-text" x="804" y="514" text-anchor="start">commit broker, device, receipt</text><path class="edge" marker-end="url(#arrow)" d="M420,485 L461,485"/><path class="edge" marker-end="url(#arrow)" d="M735,485 L776,485"/><rect x="90" y="625" width="300" height="30" rx="15" fill="#B91C1C"/><text class="pill" x="240.0" y="645" text-anchor="middle">Connected is not full authority</text><rect x="445" y="625" width="315" height="30" rx="15" fill="#B45309"/><text class="pill" x="602.5" y="645" text-anchor="middle">Compensation is a new real-world action</text><rect x="820" y="625" width="300" height="30" rx="15" fill="#0F766E"/><text class="pill" x="970.0" y="645" text-anchor="middle">Receipt unknown: stop retrying</text></svg>