</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563EB"/></marker><marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#CBD5E1"/></marker></defs><rect class="bg" width="1200" height="720"/><text class="title" x="48" y="52">EP07 | The control plane of a supportive AgentOS</text><text class="sub" x="48" y="82">AgentOS does not think for the model. It organizes the system conditions intelligence needs to enter reality.</text><rect class="node blue" x="55" y="145" width="195" height="85"/><rect x="55" y="145" width="8" height="85" rx="4" fill="#2563EB"/><text class="node-title" x="79" y="179" text-anchor="start">Resources</text><text class="node-text" x="79" y="207" text-anchor="start">Budget, compute, storage</text><rect class="node teal" x="285" y="145" width="195" height="85"/><rect x="285" y="145" width="8" height="85" rx="4" fill="#0F766E"/><text class="node-title" x="309" y="179" text-anchor="start">Capabilities</text><text class="node-text" x="309" y="207" text-anchor="start">Tools, Skills, models</text><rect class="node purple" x="515" y="145" width="195" height="85"/><rect x="515" y="145" width="8" height="85" rx="4" fill="#7C3AED"/><text class="node-title" x="539" y="179" text-anchor="start">Permissions</text><text class="node-text" x="539" y="207" text-anchor="start">Lease, scope, expiry</text><rect class="node amber" x="745" y="145" width="195" height="85"/><rect x="745" y="145" width="8" height="85" rx="4" fill="#B45309"/><text class="node-title" x="769" y="179" text-anchor="start">Identity</text><text class="node-text" x="769" y="207" text-anchor="start">Principal, device, service</text><rect class="node red" x="975" y="145" width="195" height="85"/><rect x="975" y="145" width="8" height="85" rx="4" fill="#B91C1C"/><text class="node-title" x="999" y="179" text-anchor="start">Memory</text><text class="node-text" x="999" y="207" text-anchor="start">Tiers, recall, deletion</text><rect class="node blue" x="55" y="270" width="195" height="85"/><rect x="55" y="270" width="8" height="85" rx="4" fill="#2563EB"/><text class="node-title" x="79" y="304" text-anchor="start">Versions</text><text class="node-text" x="79" y="332" text-anchor="start">Derive, roll back, audit</text><rect class="node teal" x="285" y="270" width="195" height="85"/><rect x="285" y="270" width="8" height="85" rx="4" fill="#0F766E"/><text class="node-title" x="309" y="304" text-anchor="start">Isolation</text><text class="node-text" x="309" y="332" text-anchor="start">Sandboxes, workspaces</text><rect class="node purple" x="515" y="270" width="195" height="85"/><rect x="515" y="270" width="8" height="85" rx="4" fill="#7C3AED"/><text class="node-title" x="539" y="304" text-anchor="start">Audit</text><text class="node-text" x="539" y="332" text-anchor="start">Logs, evidence, receipts</text><rect class="node amber" x="745" y="270" width="195" height="85"/><rect x="745" y="270" width="8" height="85" rx="4" fill="#B45309"/><text class="node-title" x="769" y="304" text-anchor="start">Policy</text><text class="node-text" x="769" y="332" text-anchor="start">Risk, stop, escalation</text><rect class="node red" x="975" y="270" width="195" height="85"/><rect x="975" y="270" width="8" height="85" rx="4" fill="#B91C1C"/><text class="node-title" x="999" y="304" text-anchor="start">Commit</text><text class="node-text" x="999" y="332" text-anchor="start">Authorize, run, confirm</text><rect class="node blue" x="155" y="465" width="250" height="100"/><rect x="155" y="465" width="8" height="100" rx="4" fill="#2563EB"/><text class="node-title" x="179" y="499" text-anchor="start">Discover and request</text><text class="node-text" x="179" y="527" text-anchor="start">The agent can spot gaps</text><text class="node-text" x="179" y="549" text-anchor="start">Requests capability, resources</text><rect class="node amber" x="475" y="465" width="250" height="100"/><rect x="475" y="465" width="8" height="100" rx="4" fill="#B45309"/><text class="node-title" x="499" y="499" text-anchor="start">Advise and approve</text><text class="node-text" x="499" y="527" text-anchor="start">Independent risk review</text><text class="node-text" x="499" y="549" text-anchor="start">Approval split from issuance</text><rect class="node red" x="795" y="465" width="250" height="100"/><rect x="795" y="465" width="8" height="100" rx="4" fill="#B91C1C"/><text class="node-title" x="819" y="499" text-anchor="start">Commit broker</text><text class="node-text" x="819" y="527" text-anchor="start">Model cannot self-issue</text><text class="node-text" x="819" y="549" text-anchor="start">Receipts; reconcile Unknown</text><path class="edge" marker-end="url(#arrow)" d="M405,515 L471,515"/><path class="edge" marker-end="url(#arrow)" d="M725,515 L791,515"/><rect x="110" y="635" width="300" height="30" rx="15" fill="#2563EB"/><text class="pill" x="260.0" y="655" text-anchor="middle">Harness governs call order</text><rect x="465" y="635" width="300" height="30" rx="15" fill="#7C3AED"/><text class="pill" x="615.0" y="655" text-anchor="middle">AgentOS governs system power</text><rect x="820" y="635" width="300" height="30" rx="15" fill="#0F766E"/><text class="pill" x="970.0" y="655" text-anchor="middle">More support, freer exploration</text></svg>