<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><style>
.bg{fill:#F7F9FC}.title{font:700 28px sans-serif;fill:#1F2937}.sub{font:400 16px sans-serif;fill:#64748B}.node{stroke:#CBD5E1;stroke-width:2;rx:14;fill:#FFFFFF}.blue{fill:#EFF6FF;stroke:#93C5FD}.teal{fill:#ECFDF5;stroke:#6EE7B7}.amber{fill:#FFFBEB;stroke:#FCD34D}.red{fill:#FEF2F2;stroke:#FCA5A5}.purple{fill:#F5F3FF;stroke:#C4B5FD}.node-title{font:700 18px sans-serif;fill:#1F2937}.node-text{font:400 14px sans-serif;fill:#64748B}.label{font:700 14px sans-serif;fill:#1F2937}.small{font:400 12px sans-serif;fill:#64748B}.edge{stroke:#2563EB;stroke-width:3;fill:none}.edge-muted{stroke:#CBD5E1;stroke-width:3;fill:none}.dashed{stroke-dasharray:8 7}.pill{font:700 13px sans-serif;fill:#FFFFFF}
</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563EB"/></marker><marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#CBD5E1"/></marker></defs><rect class="bg" width="1200" height="720"/><text class="title" x="48" y="52">EP07｜支撑型 AgentOS 的控制面</text><text class="sub" x="48" y="82">AgentOS 不替模型思考，而是把智能进入现实所需的系统条件组织起来。</text><rect class="node blue" x="55" y="145" width="195" height="85"/><rect x="55" y="145" width="8" height="85" rx="4" fill="#2563EB"/><text class="node-title" x="79" y="179" text-anchor="start">资源</text><text class="node-text" x="79" y="207" text-anchor="start">预算、算力、存储</text><rect class="node teal" x="285" y="145" width="195" height="85"/><rect x="285" y="145" width="8" height="85" rx="4" fill="#0F766E"/><text class="node-title" x="309" y="179" text-anchor="start">能力</text><text class="node-text" x="309" y="207" text-anchor="start">工具、Skill、模型</text><rect class="node purple" x="515" y="145" width="195" height="85"/><rect x="515" y="145" width="8" height="85" rx="4" fill="#7C3AED"/><text class="node-title" x="539" y="179" text-anchor="start">权限</text><text class="node-text" x="539" y="207" text-anchor="start">租约、范围、时效</text><rect class="node amber" x="745" y="145" width="195" height="85"/><rect x="745" y="145" width="8" height="85" rx="4" fill="#B45309"/><text class="node-title" x="769" y="179" text-anchor="start">身份</text><text class="node-text" x="769" y="207" text-anchor="start">主体、设备、服务</text><rect class="node red" x="975" y="145" width="195" height="85"/><rect x="975" y="145" width="8" height="85" rx="4" fill="#B91C1C"/><text class="node-title" x="999" y="179" text-anchor="start">记忆</text><text class="node-text" x="999" y="207" text-anchor="start">分层、召回、删除</text><rect class="node blue" x="55" y="270" width="195" height="85"/><rect x="55" y="270" width="8" height="85" rx="4" fill="#2563EB"/><text class="node-title" x="79" y="304" text-anchor="start">版本</text><text class="node-text" x="79" y="332" text-anchor="start">派生、回撤、审计</text><rect class="node teal" x="285" y="270" width="195" height="85"/><rect x="285" y="270" width="8" height="85" rx="4" fill="#0F766E"/><text class="node-title" x="309" y="304" text-anchor="start">隔离</text><text class="node-text" x="309" y="332" text-anchor="start">沙箱、工作区、边界</text><rect class="node purple" x="515" y="270" width="195" height="85"/><rect x="515" y="270" width="8" height="85" rx="4" fill="#7C3AED"/><text class="node-title" x="539" y="304" text-anchor="start">审计</text><text class="node-text" x="539" y="332" text-anchor="start">日志、证据、回执</text><rect class="node amber" x="745" y="270" width="195" height="85"/><rect x="745" y="270" width="8" height="85" rx="4" fill="#B45309"/><text class="node-title" x="769" y="304" text-anchor="start">策略</text><text class="node-text" x="769" y="332" text-anchor="start">风险、停止、升级</text><rect class="node red" x="975" y="270" width="195" height="85"/><rect x="975" y="270" width="8" height="85" rx="4" fill="#B91C1C"/><text class="node-title" x="999" y="304" text-anchor="start">提交</text><text class="node-text" x="999" y="332" text-anchor="start">授权、执行、确认</text><rect class="node blue" x="155" y="465" width="250" height="100"/><rect x="155" y="465" width="8" height="100" rx="4" fill="#2563EB"/><text class="node-title" x="179" y="499" text-anchor="start">自主发现与申请</text><text class="node-text" x="179" y="527" text-anchor="start">Agent 可以发现缺口</text><text class="node-text" x="179" y="549" text-anchor="start">提出能力与资源申请</text><rect class="node amber" x="475" y="465" width="250" height="100"/><rect x="475" y="465" width="8" height="100" rx="4" fill="#B45309"/><text class="node-title" x="499" y="499" text-anchor="start">安全建议与批准</text><text class="node-text" x="499" y="527" text-anchor="start">独立风险判断</text><text class="node-text" x="499" y="549" text-anchor="start">批准和签发分离</text><rect class="node red" x="795" y="465" width="250" height="100"/><rect x="795" y="465" width="8" height="100" rx="4" fill="#B91C1C"/><text class="node-title" x="819" y="499" text-anchor="start">提交代理</text><text class="node-text" x="819" y="527" text-anchor="start">模型不能自我签发</text><text class="node-text" x="819" y="549" text-anchor="start">逐项回执，未知先对账</text><path class="edge" marker-end="url(#arrow)" d="M405,515 L471,515"/><path class="edge" marker-end="url(#arrow)" d="M725,515 L791,515"/><rect x="110" y="635" width="300" height="30" rx="15" fill="#2563EB"/><text class="pill" x="260.0" y="655" text-anchor="middle">Harness 管调用秩序</text><rect x="465" y="635" width="300" height="30" rx="15" fill="#7C3AED"/><text class="pill" x="615.0" y="655" text-anchor="middle">AgentOS 管系统权力</text><rect x="820" y="635" width="300" height="30" rx="15" fill="#0F766E"/><text class="pill" x="970.0" y="655" text-anchor="middle">支撑越强，探索越自由</text></svg>