</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563EB"/></marker><marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#CBD5E1"/></marker></defs><rect class="bg" width="1200" height="720"/><text class="title" x="48" y="52">EP11 | Rungs of evidence and active falsification</text><text class="sub" x="48" y="82">Trust does not require zero unknowns: mark the unknown, bound the known, and let real results overturn the vision.</text><rect class="node blue" x="70" y="160" width="235" height="145"/><rect x="70" y="160" width="8" height="145" rx="4" fill="#2563EB"/><text class="node-title" x="94" y="194" text-anchor="start">Methodology</text><text class="node-text" x="94" y="222" text-anchor="start">States principles</text><text class="node-text" x="94" y="244" text-anchor="start">Why design it this way</text><path class="edge" marker-end="url(#arrow)" d="M305,232 L345,232"/><rect class="node purple" x="355" y="160" width="235" height="145"/><rect x="355" y="160" width="8" height="145" rx="4" fill="#7C3AED"/><text class="node-title" x="379" y="194" text-anchor="start">Target architecture</text><text class="node-text" x="379" y="222" text-anchor="start">System design</text><text class="node-text" x="379" y="244" text-anchor="start">Mechanisms it would need</text><path class="edge" marker-end="url(#arrow)" d="M590,232 L630,232"/><rect class="node teal" x="640" y="160" width="235" height="145"/><rect x="640" y="160" width="8" height="145" rx="4" fill="#0F766E"/><text class="node-title" x="664" y="194" text-anchor="start">Prototype</text><text class="node-text" x="664" y="222" text-anchor="start">Runs in part</text><text class="node-text" x="664" y="244" text-anchor="start">Built, within what scope</text><path class="edge" marker-end="url(#arrow)" d="M875,232 L915,232"/><rect class="node red" x="925" y="160" width="235" height="145"/><rect x="925" y="160" width="8" height="145" rx="4" fill="#B91C1C"/><text class="node-title" x="949" y="194" text-anchor="start">Real-world validation</text><text class="node-text" x="949" y="222" text-anchor="start">Target environment</text><text class="node-text" x="949" y="244" text-anchor="start">Survives real tasks, risks</text><rect class="node blue" x="100" y="425" width="290" height="110"/><rect x="100" y="425" width="8" height="110" rx="4" fill="#2563EB"/><text class="node-title" x="124" y="459" text-anchor="start">Benchmark</text><text class="node-text" x="124" y="487" text-anchor="start">Real tasks, quality bar</text><text class="node-text" x="124" y="509" text-anchor="start">Safety constraints, total cost</text><rect class="node purple" x="455" y="425" width="290" height="110"/><rect x="455" y="425" width="8" height="110" rx="4" fill="#7C3AED"/><text class="node-title" x="479" y="459" text-anchor="start">Falsification paths</text><text class="node-text" x="479" y="487" text-anchor="start">Baselines, ablation, regression</text><text class="node-text" x="479" y="509" text-anchor="start">Cross-condition repro, red team</text><rect class="node red" x="810" y="425" width="290" height="110"/><rect x="810" y="425" width="8" height="110" rx="4" fill="#B91C1C"/><text class="node-title" x="834" y="459" text-anchor="start">Honest disclosure</text><text class="node-text" x="834" y="487" text-anchor="start">Known, proposed, to be verified</text><text class="node-text" x="834" y="509" text-anchor="start">Real-env evidence: none yet</text><path class="edge" marker-end="url(#arrow)" d="M390,480 L451,480"/><path class="edge" marker-end="url(#arrow)" d="M745,480 L806,480"/><rect x="90" y="625" width="310" height="30" rx="15" fill="#2563EB"/><text class="pill" x="245.0" y="645" text-anchor="middle">A demo shows one success path</text><rect x="455" y="625" width="300" height="30" rx="15" fill="#B91C1C"/><text class="pill" x="605.0" y="645" text-anchor="middle">Trust rests on failure and unknowns</text><rect x="800" y="625" width="320" height="30" rx="15" fill="#0F766E"/><text class="pill" x="960.0" y="645" text-anchor="middle">Credibility comes from refutability</text></svg>