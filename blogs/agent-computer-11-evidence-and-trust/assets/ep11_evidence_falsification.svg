<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><style>
.bg{fill:#F7F9FC}.title{font:700 28px sans-serif;fill:#1F2937}.sub{font:400 16px sans-serif;fill:#64748B}.node{stroke:#CBD5E1;stroke-width:2;rx:14;fill:#FFFFFF}.blue{fill:#EFF6FF;stroke:#93C5FD}.teal{fill:#ECFDF5;stroke:#6EE7B7}.amber{fill:#FFFBEB;stroke:#FCD34D}.red{fill:#FEF2F2;stroke:#FCA5A5}.purple{fill:#F5F3FF;stroke:#C4B5FD}.node-title{font:700 18px sans-serif;fill:#1F2937}.node-text{font:400 14px sans-serif;fill:#64748B}.label{font:700 14px sans-serif;fill:#1F2937}.small{font:400 12px sans-serif;fill:#64748B}.edge{stroke:#2563EB;stroke-width:3;fill:none}.edge-muted{stroke:#CBD5E1;stroke-width:3;fill:none}.dashed{stroke-dasharray:8 7}.pill{font:700 13px sans-serif;fill:#FFFFFF}
</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563EB"/></marker><marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#CBD5E1"/></marker></defs><rect class="bg" width="1200" height="720"/><text class="title" x="48" y="52">EP11｜证据分级与主动证伪</text><text class="sub" x="48" y="82">可信不是没有未知，而是把未知标出来，把已知限定住，并允许现实结果推翻愿景。</text><rect class="node blue" x="70" y="160" width="235" height="145"/><rect x="70" y="160" width="8" height="145" rx="4" fill="#2563EB"/><text class="node-title" x="94" y="194" text-anchor="start">方法论</text><text class="node-text" x="94" y="222" text-anchor="start">提出原则</text><text class="node-text" x="94" y="244" text-anchor="start">为什么应该这样做</text><path class="edge" marker-end="url(#arrow)" d="M305,232 L345,232"/><rect class="node purple" x="355" y="160" width="235" height="145"/><rect x="355" y="160" width="8" height="145" rx="4" fill="#7C3AED"/><text class="node-title" x="379" y="194" text-anchor="start">目标架构</text><text class="node-text" x="379" y="222" text-anchor="start">系统设计</text><text class="node-text" x="379" y="244" text-anchor="start">如果实现，需要哪些机制</text><path class="edge" marker-end="url(#arrow)" d="M590,232 L630,232"/><rect class="node teal" x="640" y="160" width="235" height="145"/><rect x="640" y="160" width="8" height="145" rx="4" fill="#0F766E"/><text class="node-title" x="664" y="194" text-anchor="start">原型实现</text><text class="node-text" x="664" y="222" text-anchor="start">局部跑通</text><text class="node-text" x="664" y="244" text-anchor="start">在什么范围内已经做出来</text><path class="edge" marker-end="url(#arrow)" d="M875,232 L915,232"/><rect class="node red" x="925" y="160" width="235" height="145"/><rect x="925" y="160" width="8" height="145" rx="4" fill="#B91C1C"/><text class="node-title" x="949" y="194" text-anchor="start">真实验证</text><text class="node-text" x="949" y="222" text-anchor="start">目标环境</text><text class="node-text" x="949" y="244" text-anchor="start">是否经受真实任务与风险</text><rect class="node blue" x="100" y="425" width="290" height="110"/><rect x="100" y="425" width="8" height="110" rx="4" fill="#2563EB"/><text class="node-title" x="124" y="459" text-anchor="start">Benchmark</text><text class="node-text" x="124" y="487" text-anchor="start">真实任务、质量门槛</text><text class="node-text" x="124" y="509" text-anchor="start">安全约束、总成本</text><rect class="node purple" x="455" y="425" width="290" height="110"/><rect x="455" y="425" width="8" height="110" rx="4" fill="#7C3AED"/><text class="node-title" x="479" y="459" text-anchor="start">证伪路径</text><text class="node-text" x="479" y="487" text-anchor="start">基线、消融、回归</text><text class="node-text" x="479" y="509" text-anchor="start">跨条件复现、红队</text><rect class="node red" x="810" y="425" width="290" height="110"/><rect x="810" y="425" width="8" height="110" rx="4" fill="#B91C1C"/><text class="node-title" x="834" y="459" text-anchor="start">诚实披露</text><text class="node-text" x="834" y="487" text-anchor="start">已知、提出、待验证</text><text class="node-text" x="834" y="509" text-anchor="start">真实目标环境证据为空</text><path class="edge" marker-end="url(#arrow)" d="M390,480 L451,480"/><path class="edge" marker-end="url(#arrow)" d="M745,480 L806,480"/><rect x="90" y="625" width="310" height="30" rx="15" fill="#2563EB"/><text class="pill" x="245.0" y="645" text-anchor="middle">Demo 证明成功路径</text><rect x="455" y="625" width="300" height="30" rx="15" fill="#B91C1C"/><text class="pill" x="605.0" y="645" text-anchor="middle">系统信任取决于失败和未知</text><rect x="800" y="625" width="320" height="30" rx="15" fill="#0F766E"/><text class="pill" x="960.0" y="645" text-anchor="middle">可信来自可被推翻</text></svg>