<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><style>
.bg{fill:#F7F9FC}.title{font:700 28px sans-serif;fill:#1F2937}.sub{font:400 16px sans-serif;fill:#64748B}.node{stroke:#CBD5E1;stroke-width:2;rx:14;fill:#FFFFFF}.blue{fill:#EFF6FF;stroke:#93C5FD}.teal{fill:#ECFDF5;stroke:#6EE7B7}.amber{fill:#FFFBEB;stroke:#FCD34D}.red{fill:#FEF2F2;stroke:#FCA5A5}.purple{fill:#F5F3FF;stroke:#C4B5FD}.node-title{font:700 18px sans-serif;fill:#1F2937}.node-text{font:400 14px sans-serif;fill:#64748B}.label{font:700 14px sans-serif;fill:#1F2937}.small{font:400 12px sans-serif;fill:#64748B}.edge{stroke:#2563EB;stroke-width:3;fill:none}.edge-muted{stroke:#CBD5E1;stroke-width:3;fill:none}.dashed{stroke-dasharray:8 7}.pill{font:700 13px sans-serif;fill:#FFFFFF}
</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563EB"/></marker><marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#CBD5E1"/></marker></defs><rect class="bg" width="1200" height="720"/><text class="title" x="48" y="52">EP01 | From answering to finishing the task</text><text class="sub" x="48" y="82">Today&#x27;s AI compresses the task space too early; Agent Computer reorganizes tasks, choice, support and real-world execution.</text><rect class="node blue" x="56" y="150" width="210" height="120"/><rect x="56" y="150" width="8" height="120" rx="4" fill="#2563EB"/><text class="node-title" x="80" y="184" text-anchor="start">One sentence</text><text class="node-text" x="80" y="212" text-anchor="start">goal, object, scope</text><text class="node-text" x="80" y="234" text-anchor="start">acceptance, perms, risk</text><rect class="node red" x="330" y="150" width="210" height="120"/><rect x="330" y="150" width="8" height="120" rx="4" fill="#B91C1C"/><text class="node-title" x="354" y="184" text-anchor="start">Usual pipeline</text><text class="node-text" x="354" y="212" text-anchor="start">one model pass</text><text class="node-text" x="354" y="234" text-anchor="start">one execution path</text><text class="node-text" x="354" y="256" text-anchor="start">one result</text><rect class="node amber" x="604" y="150" width="210" height="120"/><rect x="604" y="150" width="8" height="120" rx="4" fill="#B45309"/><text class="node-title" x="628" y="184" text-anchor="start">Looks finished</text><text class="node-text" x="628" y="212" text-anchor="start">a complete answer</text><text class="node-text" x="628" y="234" text-anchor="start">opaque conditions</text><text class="node-text" x="628" y="256" text-anchor="start">reality may not change</text><rect class="node red" x="878" y="150" width="260" height="120"/><rect x="878" y="150" width="8" height="120" rx="4" fill="#B91C1C"/><text class="node-title" x="902" y="184" text-anchor="start">User fills the gaps</text><text class="node-text" x="902" y="212" text-anchor="start">judges whether it fits</text><text class="node-text" x="902" y="234" text-anchor="start">checks the risk</text><text class="node-text" x="902" y="256" text-anchor="start">bears the outcome</text><path class="edge" marker-end="url(#arrow)" d="M266,210 L326,210"/><path class="edge" marker-end="url(#arrow)" d="M540,210 L600,210"/><path class="edge" marker-end="url(#arrow)" d="M814,210 L874,210"/><rect class="node teal" x="56" y="430" width="210" height="120"/><rect x="56" y="430" width="8" height="120" rx="4" fill="#0F766E"/><text class="node-title" x="80" y="464" text-anchor="start">Task structure</text><text class="node-text" x="80" y="492" text-anchor="start">goals &amp; constraints</text><text class="node-text" x="80" y="514" text-anchor="start">evidence &amp; uncertainty</text><text class="node-text" x="80" y="536" text-anchor="start">capabilities &amp; perms</text><rect class="node blue" x="330" y="430" width="210" height="120"/><rect x="330" y="430" width="8" height="120" rx="4" fill="#2563EB"/><text class="node-title" x="354" y="464" text-anchor="start">Conditioned choice</text><text class="node-text" x="354" y="492" text-anchor="start">bounded candidates</text><text class="node-text" x="354" y="514" text-anchor="start">controlled comparison</text><text class="node-text" x="354" y="536" text-anchor="start">validity &amp; fit</text><rect class="node purple" x="604" y="430" width="210" height="120"/><rect x="604" y="430" width="8" height="120" rx="4" fill="#7C3AED"/><text class="node-title" x="628" y="464" text-anchor="start">Support &amp; isolation</text><text class="node-text" x="628" y="492" text-anchor="start">exploration domain</text><text class="node-text" x="628" y="514" text-anchor="start">commit domain</text><text class="node-text" x="628" y="536" text-anchor="start">reality domain</text><text class="node-text" x="628" y="558" text-anchor="start">rollback &amp; audit</text><rect class="node teal" x="878" y="430" width="260" height="120"/><rect x="878" y="430" width="8" height="120" rx="4" fill="#0F766E"/><text class="node-title" x="902" y="464" text-anchor="start">Done in reality</text><text class="node-text" x="902" y="492" text-anchor="start">authorized commit</text><text class="node-text" x="902" y="514" text-anchor="start">external receipt</text><text class="node-text" x="902" y="536" text-anchor="start">experience fed back</text><path class="edge" marker-end="url(#arrow)" d="M266,490 L326,490"/><path class="edge" marker-end="url(#arrow)" d="M540,490 L600,490"/><path class="edge" marker-end="url(#arrow)" d="M814,490 L874,490"/><path class="edge-muted dashed" marker-end="url(#arrow-muted)" d="M161,272 L161,424"/><path class="edge-muted dashed" marker-end="url(#arrow-muted)" d="M435,272 L435,424"/><path class="edge-muted dashed" marker-end="url(#arrow-muted)" d="M708,272 L708,424"/><path class="edge-muted dashed" marker-end="url(#arrow-muted)" d="M1008,272 L1008,424"/><rect x="56" y="620" width="300" height="30" rx="15" fill="#B91C1C"/><text class="pill" x="206.0" y="640" text-anchor="middle">Problem: an answer is not a task</text><rect x="396" y="620" width="300" height="30" rx="15" fill="#2563EB"/><text class="pill" x="546.0" y="640" text-anchor="middle">Direction: answers → finished tasks</text><rect x="736" y="620" width="402" height="30" rx="15" fill="#0F766E"/><text class="pill" x="937.0" y="640" text-anchor="middle">Takeaway: freedom rests on support and a backstop</text></svg>