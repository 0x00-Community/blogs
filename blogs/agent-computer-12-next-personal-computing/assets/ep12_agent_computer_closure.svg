<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><style>
.bg{fill:#F7F9FC}.title{font:700 28px sans-serif;fill:#1F2937}.sub{font:400 16px sans-serif;fill:#64748B}.node{stroke:#CBD5E1;stroke-width:2;rx:14;fill:#FFFFFF}.blue{fill:#EFF6FF;stroke:#93C5FD}.teal{fill:#ECFDF5;stroke:#6EE7B7}.amber{fill:#FFFBEB;stroke:#FCD34D}.red{fill:#FEF2F2;stroke:#FCA5A5}.purple{fill:#F5F3FF;stroke:#C4B5FD}.node-title{font:700 18px sans-serif;fill:#1F2937}.node-text{font:400 14px sans-serif;fill:#64748B}.label{font:700 14px sans-serif;fill:#1F2937}.small{font:400 12px sans-serif;fill:#64748B}.edge{stroke:#2563EB;stroke-width:3;fill:none}.edge-muted{stroke:#CBD5E1;stroke-width:3;fill:none}.dashed{stroke-dasharray:8 7}.pill{font:700 13px sans-serif;fill:#FFFFFF}
</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563EB"/></marker><marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#CBD5E1"/></marker></defs><rect class="bg" width="1200" height="720"/><text class="title" x="48" y="52">EP12｜Agent Computer 的最小可行闭环</text><text class="sub" x="48" y="82">不是电脑加一个聊天框，而是围绕任务、选择、支撑、现实执行和用户主权重构个人计算。</text><rect class="node purple" x="55" y="150" width="300" height="110"/><rect x="55" y="150" width="8" height="110" rx="4" fill="#7C3AED"/><text class="node-title" x="79" y="184" text-anchor="start">任务</text><text class="node-text" x="79" y="212" text-anchor="start">目标、证据、约束</text><path class="edge" marker-end="url(#arrow)" d="M355,205 L430,205"/><rect class="node blue" x="440" y="150" width="300" height="110"/><rect x="440" y="150" width="8" height="110" rx="4" fill="#2563EB"/><text class="node-title" x="464" y="184" text-anchor="start">选择</text><text class="node-text" x="464" y="212" text-anchor="start">候选、条件、依据</text><path class="edge" marker-end="url(#arrow)" d="M740,205 L815,205"/><rect class="node teal" x="825" y="150" width="300" height="110"/><rect x="825" y="150" width="8" height="110" rx="4" fill="#0F766E"/><text class="node-title" x="849" y="184" text-anchor="start">支撑</text><text class="node-text" x="849" y="212" text-anchor="start">资源、能力、权限</text><path class="edge-muted dashed" marker-end="url(#arrow-muted)" d="M975,260 L975,300"/><rect class="node amber" x="55" y="315" width="300" height="110"/><rect x="55" y="315" width="8" height="110" rx="4" fill="#B45309"/><text class="node-title" x="79" y="349" text-anchor="start">验证</text><text class="node-text" x="79" y="377" text-anchor="start">隔离、审计、回撤</text><path class="edge" marker-end="url(#arrow)" d="M355,370 L430,370"/><rect class="node red" x="440" y="315" width="300" height="110"/><rect x="440" y="315" width="8" height="110" rx="4" fill="#B91C1C"/><text class="node-title" x="464" y="349" text-anchor="start">提交</text><text class="node-text" x="464" y="377" text-anchor="start">授权、外部回执</text><path class="edge" marker-end="url(#arrow)" d="M740,370 L815,370"/><rect class="node teal" x="825" y="315" width="300" height="110"/><rect x="825" y="315" width="8" height="110" rx="4" fill="#0F766E"/><text class="node-title" x="849" y="349" text-anchor="start">主权</text><text class="node-text" x="849" y="377" text-anchor="start">记忆、设备、删除</text><rect class="node amber" x="270" y="515" width="660" height="70"/><rect x="270" y="515" width="8" height="70" rx="4" fill="#B45309"/><text class="node-title" x="294" y="549" text-anchor="start">最终判断</text><text class="node-text" x="294" y="577" text-anchor="start">名称不由 Demo 决定，而由真实任务中的可复现净收益、可治理边界和诚实证据决定</text><rect x="120" y="635" width="300" height="30" rx="15" fill="#2563EB"/><text class="pill" x="270.0" y="655" text-anchor="middle">先做可逆、可验证的本地任务</text><rect x="465" y="635" width="300" height="30" rx="15" fill="#B91C1C"/><text class="pill" x="615.0" y="655" text-anchor="middle">再扩大现实副作用</text><rect x="810" y="635" width="300" height="30" rx="15" fill="#0F766E"/><text class="pill" x="960.0" y="655" text-anchor="middle">必要时允许机制被删除</text></svg>